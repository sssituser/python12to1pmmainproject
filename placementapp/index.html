    <meta name="description" content="SSSIT Placement Portal – empowering students with placement tracking, AI-powered resume analysis, online assessments, job drives, and career guidance." />

    <link rel="icon" type="image/png" href="/sssit-logo.png" />

        "name": "SSSIT Computer Education",

        "logo": "/sssit-logo.png",

        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "sameAs": []
      }

    <script src="https://accounts.google.com/gsi/client" async defer></script>
